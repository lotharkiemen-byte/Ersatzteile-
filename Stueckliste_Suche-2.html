<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stückliste Suche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #EDEEE9;
    --paper: #FAFAF7;
    --ink: #20242A;
    --ink-soft: #565F68;
    --line: #D6D8D2;
    --orange: #DB5A1B;
    --orange-dim: #F3E0D2;
    --steel: #2C4A73;
    --steel-dim: #DCE4EE;
    --graphite: #565C60;
    --graphite-dim: #E3E4E1;
    --ok: #2F7A4C;
    --warn: #B23B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;padding:0 0 48px;}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px 16px;
    border-bottom:4px solid var(--steel);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#B7BDC4; margin:0 0 2px;
    display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .eyebrow .ticks{display:inline-flex; gap:2px; height:10px;}
  .eyebrow .ticks span{width:2px; background:var(--steel); display:inline-block;}
  .sync-state{font-size:10px; letter-spacing:.08em; color:#8B929A; cursor:pointer;}
  .sync-state.live{color:#7BC48F;}
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; text-transform:uppercase; letter-spacing:.01em;
    font-size:30px; margin:0 0 12px; line-height:1;
  }
  .search-wrap{position:relative;}
  #search{
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    padding:13px 44px 13px 14px;
    border-radius:3px;
    border:1px solid #3A3F46;
    background:#2B2F35;
    color:var(--paper);
    outline:none;
  }
  #search::placeholder{color:#7C838B;}
  #search:focus{border-color:var(--steel); box-shadow:0 0 0 3px rgba(44,74,115,.35);}
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#8B929A; cursor:pointer;
    font-size:18px; padding:6px 8px; line-height:1; display:none;
  }
  .clear-btn.show{display:block;}
  .clear-btn:hover{color:var(--paper);}

  .hint-row{
    margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:#9BA3AB;
  }

  .meta-bar{
    padding:12px 20px 6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .meta-bar b{color:var(--ink); font-weight:600;}

  #results{padding:4px 14px 0;}

  .group-header{
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
    font-size:18px; font-weight:700; letter-spacing:.02em;
    margin:18px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--steel);
    color:var(--ink);
    display:flex; align-items:baseline; gap:8px;
  }
  .group-header .laypos-badge{
    font-family:'IBM Plex Mono',monospace; background:var(--steel); color:var(--paper);
    padding:2px 8px; border-radius:2px; font-size:14px; letter-spacing:0;
  }

  .card{
    background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--graphite);
    border-radius:2px; padding:12px 14px; margin-bottom:8px;
  }
  .card.linked{border-left-color:var(--ok);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .bez{font-weight:600; font-size:14.5px; line-height:1.3; text-transform:uppercase;}
  .artikel-tag{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  mark{background:var(--steel); color:#fff; padding:0 1px; border-radius:2px;}

  .card-bottom{display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:10px; align-items:center;}
  .info-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.02em;
    background:var(--graphite-dim); color:var(--graphite); padding:4px 8px; border-radius:2px;
  }
  .info-pill.stufe{background:var(--steel-dim); color:var(--steel); font-weight:600;}
  .info-pill.linked{background:#DCEFE1; color:var(--ok); font-weight:600;}
  .info-pill.notlinked{background:#F3E0DB; color:var(--warn); font-style:italic;}

  .stock-editor{
    display:flex; align-items:center; gap:5px; margin-left:auto;
    background:var(--bg); border-radius:3px; padding:3px 4px;
  }
  .stock-editor button{
    width:24px; height:24px; border-radius:2px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:14px; font-weight:700;
    cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .stock-editor button:hover{border-color:var(--steel); color:var(--steel);}
  .stock-editor input{
    width:38px; text-align:center; border:none; background:transparent;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; color:var(--ink);
  }
  .stock-editor input:focus{outline:none;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:38px; margin-bottom:8px;}
  .empty-state p{font-family:'IBM Plex Mono',monospace; font-size:13px;}

  .loading-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:13px;}

  footer{
    text-align:center; padding:20px; font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:#9AA0A6; letter-spacing:.05em;
  }
  a.footer-link{color:#9AA0A6;}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">
      <span style="display:flex;align-items:center;gap:8px;"><span class="ticks"><span style="height:10px"></span><span style="height:6px"></span><span style="height:10px"></span><span style="height:4px"></span><span style="height:10px"></span></span>Stückliste · Lay.-Pos. Referenz</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="sync-state" id="syncState">Lädt…</span>
        <a href="index.html" style="color:#8B929A; text-decoration:underline; font-size:10px; letter-spacing:.08em;">→ Ersatzteile</a>
      </span>
    </p>
    <h1>Stückliste Suche</h1>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Lay.-Pos. eingeben, z.B. 405" autocomplete="off" inputmode="numeric">
      <button class="clear-btn" id="clearBtn" aria-label="Suche löschen">✕</button>
    </div>
    <p class="hint-row">Grün umrandete Artikel sind in der Ersatzteilliste hinterlegt und direkt buchbar.</p>
  </header>

  <div class="meta-bar">
    <span id="countLabel"><b>0</b> Treffer</span>
    <span id="filterLabel"></span>
  </div>

  <div id="results"><div class="loading-state">Stückliste wird geladen…</div></div>
</div>

<footer>LAY.-POS. · ID-NR. · BEZEICHNUNG · ZEICHNUNGS-NR.<br>
<a class="footer-link" href="index.html">← Zur Ersatzteile-Suche</a></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwUzvV-31Sy7geZySxCrSn2E4uzodt-H8",
  authDomain: "ersatzteile-a34dc.firebaseapp.com",
  databaseURL: "https://ersatzteile-a34dc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ersatzteile-a34dc",
  storageBucket: "ersatzteile-a34dc.firebasestorage.app",
  messagingSenderId: "1083280470999",
  appId: "1:1083280470999:web:ffa010536b836658021192"
};

let db = null, auth = null, firebaseOk = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  auth = firebase.auth();
  firebaseOk = true;
}catch(e){
  console.error('Firebase-Initialisierung fehlgeschlagen', e);
}

const TEAM_EMAIL = 'fricke@ersatzteile.de';

async function ensureAuth(){
  if(!firebaseOk || !auth) return false;
  if(auth.currentUser) return true;
  const pwd = window.prompt('Passwort zum Ändern der Liste eingeben:');
  if(pwd === null || pwd.trim() === '') return false;
  try{
    await auth.signInWithEmailAndPassword(TEAM_EMAIL, pwd);
    return true;
  }catch(e){
    console.error('Anmeldung fehlgeschlagen', e);
    alert('Falsches Passwort oder Anmeldung fehlgeschlagen.');
    return false;
  }
}

let BOM = {};       // { layPos: [ {stufe, idNr, rmNr, zePos, bez, zng, laenge}, ... ] }
let STOCK = {};      // { artikel: itemObjectFromErsatzteilliste }
let bomLoaded = false;

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultsEl = document.getElementById('results');
const countLabel = document.getElementById('countLabel');
const filterLabel = document.getElementById('filterLabel');
const syncState = document.getElementById('syncState');

function norm(s){ return (s || '').toString().toLowerCase(); }
function escapeHtml(str){
  return str.toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  const t = text.toString();
  const idx = norm(t).indexOf(norm(query));
  if(idx === -1) return escapeHtml(t);
  return escapeHtml(t.slice(0,idx)) + '<mark>' + escapeHtml(t.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(t.slice(idx+query.length));
}

// Stückliste laden (statische Datei, liegt neben index.html)
fetch('bom-data.json')
  .then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    BOM = data;
    bomLoaded = true;
    render();
  })
  .catch(e => {
    console.error('Stückliste konnte nicht geladen werden', e);
    resultsEl.innerHTML = '<div class="empty-state"><div class="big">⚠</div><p>Stückliste (bom-data.json) konnte nicht geladen werden.<br>Liegt die Datei im selben Ordner wie diese Seite?</p></div>';
  });

// Bestand aus der Ersatzteilliste live mitlesen (gleiche Firebase-Quelle)
if(firebaseOk){
  db.ref('items').on('value', snap => {
    STOCK = snap.exists() ? snap.val() : {};
    syncState.textContent = 'Live verknüpft';
    syncState.classList.add('live');
    render();
  }, err => {
    console.error('Firebase Sync-Fehler', err);
    syncState.textContent = 'Fehler — nur Stückliste aktiv';
    syncState.classList.remove('live');
  });
} else {
  syncState.textContent = 'Kein Firebase — nur Stückliste';
}

// Gleicht Artikelnummern ab, auch wenn die Stückliste führende Nullen
// verwendet, die Ersatzteilliste aber nicht (z.B. "01940462" vs "1940462").
function resolveStockKey(idNr){
  if(!idNr) return null;
  if(STOCK[idNr] != null) return idNr;
  const stripped = idNr.replace(/^0+(?=\d)/, '');
  if(STOCK[stripped] != null) return stripped;
  return null;
}

function totalVorhanden(item){
  if(Array.isArray(item.orte) && item.orte.length > 0){
    return item.orte.reduce((sum, loc) => sum + (Number(loc.vorhanden) || 0), 0);
  }
  return Number(item.vorhanden) || 0;
}

async function adjustStock(artikel, delta){
  const item = STOCK[artikel];
  if(!item) return;
  const authed = await ensureAuth();
  if(!authed) return;
  const hasOrte = Array.isArray(item.orte) && item.orte.length > 0;
  const before = hasOrte ? (Number(item.orte[0].vorhanden) || 0) : (Number(item.vorhanden) || 0);
  const after = Math.max(0, before + delta);
  const path = hasOrte ? 'items/'+artikel+'/orte/0/vorhanden' : 'items/'+artikel+'/vorhanden';
  db.ref(path).set(after)
    .catch(e => console.error('Bestand konnte nicht synchronisiert werden', e));
  db.ref('log').push({
    artikel: artikel,
    bezeichnung: item.bezeichnung || item.bez || '',
    delta: after - before,
    ts: Date.now(),
    date: new Date().toLocaleString('de-DE')
  }).catch(e => console.error(e));
}

function stockEditorHtml(artikel, item){
  const val = totalVorhanden(item);
  const multi = Array.isArray(item.orte) && item.orte.length > 1;
  return '<span class="stock-editor" data-artikel="'+escapeHtml(artikel)+'"'+(multi ? ' title="Mehrere Lagerplätze — Buchung wirkt auf Platz 1. Für Details Ersatzteilliste öffnen."' : '')+'>'
    + '<button class="minus" title="Entnahme">−</button>'
    + '<span style="font-family:\'IBM Plex Mono\',monospace;font-weight:600;font-size:12.5px;min-width:20px;text-align:center;">'+escapeHtml(val)+(multi ? '*' : '')+'</span>'
    + '<button class="plus" title="Zugang">+</button>'
    + '</span>';
}

function render(){
  if(!bomLoaded) return;
  const q = searchInput.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);

  const allKeys = Object.keys(BOM);

  if(!q){
    countLabel.innerHTML = '<b>' + allKeys.length + '</b> Lay.-Positionen insgesamt';
    filterLabel.textContent = '';
    resultsEl.innerHTML = '<div class="empty-state"><div class="big">🔍</div><p>Lay.-Pos.-Nummer eingeben, um Artikel anzuzeigen</p></div>';
    return;
  }

  // Exakte Treffer zuerst, dann Präfix-Treffer
  const exact = allKeys.filter(k => k === q);
  const prefix = allKeys.filter(k => k !== q && k.startsWith(q)).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  const matchKeys = exact.concat(prefix).slice(0, 30);

  const totalArtikel = matchKeys.reduce((sum,k) => sum + BOM[k].length, 0);
  countLabel.innerHTML = '<b>' + matchKeys.length + '</b> Lay.-Pos. · <b>' + totalArtikel + '</b> Artikel';
  filterLabel.textContent = '';

  if(matchKeys.length === 0){
    resultsEl.innerHTML = '<div class="empty-state"><div class="big">∅</div><p>KEINE LAY.-POS. GEFUNDEN</p></div>';
    return;
  }

  let html = '';
  matchKeys.forEach(key => {
    html += '<div class="group-header"><span class="laypos-badge">' + highlight(key, q) + '</span> Lay.-Pos.</div>';
    BOM[key].forEach(row => {
      const linkedKey = resolveStockKey(row.idNr);
      const linkedItem = linkedKey ? STOCK[linkedKey] : null;
      const isLinked = !!linkedItem;
      html += '<div class="card ' + (isLinked ? 'linked' : '') + '">'
        + '<div class="card-top">'
        +   '<div class="bez">' + escapeHtml(row.bez || '(keine Bezeichnung)') + '</div>'
        +   '<div class="artikel-tag">' + escapeHtml(row.idNr) + '</div>'
        + '</div>'
        + '<div class="card-bottom">'
        +   (row.stufe ? '<span class="info-pill stufe">Stufe ' + escapeHtml(row.stufe) + '</span>' : '')
        +   (row.zePos ? '<span class="info-pill">Ze.-Pos. ' + escapeHtml(row.zePos) + '</span>' : '')
        +   (row.rmNr ? '<span class="info-pill">RM-Nr. ' + escapeHtml(row.rmNr) + '</span>' : '')
        +   (row.zng ? '<span class="info-pill">Zng. ' + escapeHtml(row.zng) + '</span>' : '')
        +   (row.laenge ? '<span class="info-pill">Länge ' + escapeHtml(row.laenge) + 'm</span>' : '')
        +   (isLinked
              ? '<span class="info-pill linked">In Ersatzteilliste</span>' + stockEditorHtml(linkedKey, linkedItem)
              : '<span class="info-pill notlinked">Nicht in Ersatzteilliste</span>')
        + '</div>'
        + '</div>';
    });
  });
  resultsEl.innerHTML = html;

  resultsEl.querySelectorAll('.stock-editor').forEach(editor => {
    const artikel = editor.dataset.artikel;
    editor.querySelector('.minus').addEventListener('click', () => adjustStock(artikel, -1));
    editor.querySelector('.plus').addEventListener('click', () => adjustStock(artikel, 1));
  });
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchInput.value=''; render(); searchInput.focus(); });
syncState.addEventListener('click', () => {
  alert(bomLoaded ? ('Stückliste geladen: ' + Object.keys(BOM).length + ' Lay.-Positionen.') : 'Stückliste lädt noch…');
});
</script>
</body>
</html>
